name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test-mcp-server:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
        working-directory: mcp-server

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: pytest -q --tb=short
        working-directory: backend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check backend/src

  docker-build:
    name: Docker Images Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: merlins-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: merlins-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      # Building proves the images compile; booting proves the entrypoints work
      # (standalone server path, uvicorn start) — a bad CMD would otherwise pass
      # CI and only fail at deploy.
      - name: Smoke-boot backend image
        run: |
          docker run -d --name backend-smoke -p 8000:8000 merlins-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo " backend healthy"; ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "backend never became healthy"; docker logs backend-smoke; exit 1; fi
          docker rm -f backend-smoke
      - name: Smoke-boot frontend image
        run: |
          docker run -d --name frontend-smoke -p 3000:3000 merlins-frontend:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then echo "frontend healthy"; ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "frontend never became healthy"; docker logs frontend-smoke; exit 1; fi
          docker rm -f frontend-smoke
